name: Shop images self-host

# Re-fetches every product photo listed in shopdata/products.json from its
# source CDN (the runner can reach it), resizes to a full-res + a thumb,
# commits them into docs/photos/, then builds docs/index.html referencing the
# images through jsDelivr (which serves repo files with hotlink-friendly CORS,
# unlike the source CDN). Result: a self-hosted shop whose photos actually
# display anywhere. Run from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      results_branch:
        description: 'Branch to publish the built shop to'
        required: false
        default: 'claude/shop-pages'

permissions:
  contents: write

concurrency:
  group: shop-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RBRANCH: ${{ inputs.results_branch }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --quiet requests pillow

      - name: Download + resize all photos
        run: |
          python - <<'PY'
          import os, io, json, re, time, pathlib, requests
          from PIL import Image
          data = json.load(open("shopdata/products.json", encoding="utf-8"))
          root = pathlib.Path("docs/photos"); root.mkdir(parents=True, exist_ok=True)
          sess = requests.Session()
          sess.headers.update({
              "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"),
              "Referer": "https://www.quince.com/", "Accept": "image/avif,image/webp,*/*"})
          def fetch(u):
              for attempt in (1, 2, 3):
                  try:
                      r = sess.get(u, timeout=45)
                      if r.ok and r.content:
                          return r.content
                  except requests.RequestException:
                      pass
                  time.sleep(1.5 * attempt)
              return None
          def save(data_bytes, path, maxw, q):
              try:
                  im = Image.open(io.BytesIO(data_bytes)).convert("RGB")
              except Exception:
                  return False
              w, h = im.size
              if w > maxw:
                  im = im.resize((maxw, round(h * maxw / w)))
              im.save(path, "JPEG", quality=q, optimize=True)
              return True
          ok = miss = 0
          for p in data:
              d = root / p["id"]; d.mkdir(parents=True, exist_ok=True)
              kept = []
              for i, u in enumerate(p.get("src_imgs", []), 1):
                  raw = fetch(u)
                  if not raw:
                      miss += 1; continue
                  full = d / f"{i}.jpg"; thumb = d / f"{i}_t.jpg"
                  if save(raw, full, 1600, 85):
                      save(raw, thumb, 700, 78)
                      kept.append(i); ok += 1
                  else:
                      miss += 1
              p["_kept"] = kept
          json.dump(data, open("shopdata/products.built.json", "w", encoding="utf-8"),
                    ensure_ascii=False)
          print(f"downloaded {ok} images, {miss} missed")
          PY

      - name: Commit photos (get SHA for jsDelivr)
        id: photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/photos shopdata/products.built.json
          git commit -q -m "Shop photos (self-hosted assets)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build index.html with jsDelivr URLs
        env:
          PHOTOS_SHA: ${{ steps.photos.outputs.sha }}
        run: |
          python - <<'PY'
          import os, json, html, importlib.util
          repo = os.environ["REPO"]; sha = os.environ["PHOTOS_SHA"]
          base = f"https://cdn.jsdelivr.net/gh/{repo}@{sha}/docs/photos"
          data = json.load(open("shopdata/products.built.json", encoding="utf-8"))
          RENAME = {"BRACELETES":"Bracelets","earings":"Earrings","neckless":"Necklaces",
                    "Rings · Engagement Ring":"Engagement Rings","Rings · Others":"Rings"}
          ORDER = ["Engagement Rings","Rings","Necklaces","Earrings","Bracelets"]
          for i,x in enumerate(data):
              x["cat"] = RENAME.get(x["cat"], x["cat"]); x["_i"]=i
          data.sort(key=lambda x:(ORDER.index(x["cat"]) if x["cat"] in ORDER else 99, x["_i"]))
          spec = importlib.util.spec_from_file_location("mlp","make_landing_page.py")
          mlp = importlib.util.module_from_spec(spec); spec.loader.exec_module(mlp)
          payload = []
          for p in data:
              kept = p.get("_kept", [])
              imgs = [f"{base}/{p['id']}/{n}.jpg" for n in kept]
              thumb = f"{base}/{p['id']}/{kept[0]}_t.jpg" if kept else ""
              payload.append({"id":p["id"],"cat":p["cat"],"name":p["name"],
                              "price_display":p.get("price_display",""),"from":p.get("from",False),
                              "imgs":imgs,"thumb":thumb,"details":p.get("details","")})
          out = (mlp.TEMPLATE
                 .replace("__PRODUCTS__", json.dumps(payload, ensure_ascii=False))
                 .replace("__WHATSAPP__", "919723891732")
                 .replace("__BRAND__", html.escape("SRX DIAMONDS")))
          open("docs/index.html","w",encoding="utf-8").write(out)
          n_imgs = sum(len(p["imgs"]) for p in payload)
          print(f"built index.html: {len(payload)} products, {n_imgs} images via jsDelivr")
          PY

      - name: Publish results branch
        run: |
          git add -f docs/index.html
          git commit -q -m "Shop index.html (jsDelivr-hosted photos)"
          git push -f origin HEAD:"$RBRANCH"
          echo "pushed to $RBRANCH"
