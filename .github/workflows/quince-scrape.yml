name: Verify currency live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages to update, then check currency
        run: |
          SITE="https://srxjewels-cmd.github.io/todo/"
          for t in $(seq 1 12); do
            curl -sS -o /tmp/p.html -L --max-time 40 "$SITE" || true
            if grep -q 'id="curSel"' /tmp/p.html && grep -q 'api.country.is' /tmp/p.html; then
              echo "CURRENCY LIVE after ${t} tries"
              echo "curSel present: $(grep -c 'id=\"curSel\"' /tmp/p.html)"
              echo "geo api: $(grep -c 'api.country.is' /tmp/p.html)"
              echo "fx api:  $(grep -c 'open.er-api.com' /tmp/p.html)"
              echo "PHP in menu: $(grep -oc 'PHP' /tmp/p.html)"
              img=$(curl -sS -o /tmp/i -w '%{http_code}' -L --max-time 40 "${SITE}photos/RE-01/1.jpg")
              echo "sample image: HTTP $img ($(file -b --mime-type /tmp/i))"
              exit 0
            fi
            echo "try $t: not updated yet, waiting..."; sleep 12
          done
          echo "TIMEOUT: currency markers not found on live site"; exit 1
