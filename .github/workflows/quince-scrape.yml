name: Deploy shop to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/shop-pages
      - name: Use same-origin relative image paths
        run: |
          sed -i -E 's#https://cdn\.jsdelivr\.net/gh/[^/]+/[^@]+@[a-f0-9]+/docs/photos#photos#g' docs/index.html
          echo "sample refs:"; grep -oE 'photos/[A-Z]+-01/1\.jpg' docs/index.html | sort -u | head
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
