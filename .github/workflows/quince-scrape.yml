name: Build variant shop
on:
  workflow_dispatch:
    inputs:
      scrape:
        description: 'Re-scrape Quince (else rebuild page from committed variants.json)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture Quince jewelry reference
        run: |
          cat > cap.py <<'PY'
          import json, re, pathlib, requests
          from playwright.sync_api import sync_playwright
          UA=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36")
          ref=pathlib.Path("ref"); ref.mkdir(exist_ok=True)
          def nd(h):
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
              try: return json.loads(m.group(1)) if m else None
              except Exception: return None
          # ---- facets/sort via requests ----
          try:
              h=requests.get("https://www.quince.com/shop/jewelry",headers={"User-Agent":UA},timeout=45).text
              d=nd(h)
              found={}
              KEYS={"facets","filters","refinements","availablefilters","facetfilters",
                    "sortoptions","sorts","sortby","availablesorts","refinementlist","filtergroups"}
              def walk(o,path=""):
                  if isinstance(o,dict):
                      for k,v in o.items():
                          if k.lower() in KEYS and isinstance(v,(list,dict)) and v:
                              found[path+"/"+k]=v
                          walk(v,path+"/"+k)
                  elif isinstance(o,list):
                      for v in o[:60]: walk(v,path)
              if d: walk(d)
              (ref/"facets.json").write_text(json.dumps(found,indent=1)[:60000])
              try:
                  pj=d["props"]["pageProps"]
                  (ref/"keys.txt").write_text("pageProps: "+json.dumps(list(pj.keys()))+
                     "\npageData: "+json.dumps(list((pj.get("pageData") or {}).keys())))
              except Exception as e:
                  (ref/"keys.txt").write_text("ERR "+repr(e))
              print("facets keys:", list(found.keys()))
          except Exception as e:
              print("facets FAILED", repr(e))
          # ---- screenshots via Playwright ----
          def dismiss(pg):
              for sel in ["#onetrust-accept-btn-handler","button:has-text('Accept')",
                          "button:has-text('Got it')","button:has-text('No thanks')",
                          "[aria-label='Close']","[aria-label='close']"]:
                  try: pg.click(sel,timeout=1200)
                  except Exception: pass
          try:
              with sync_playwright() as p:
                  b=p.chromium.launch(args=["--no-sandbox"])
                  ctx=b.new_context(user_agent=UA,viewport={"width":1440,"height":2200})
                  pg=ctx.new_page()
                  pg.goto("https://www.quince.com/shop/jewelry",wait_until="domcontentloaded",timeout=60000)
                  pg.wait_for_timeout(5000); dismiss(pg); pg.wait_for_timeout(2500)
                  pg.screenshot(path="ref/list_desktop.png")
                  try: (ref/"list_text.txt").write_text(pg.evaluate("()=>document.body.innerText.slice(0,5000)"))
                  except Exception: pass
                  # mobile
                  mc=b.new_context(user_agent=UA,viewport={"width":390,"height":1500},is_mobile=True)
                  mp=mc.new_page()
                  mp.goto("https://www.quince.com/shop/jewelry",wait_until="domcontentloaded",timeout=60000)
                  mp.wait_for_timeout(5000); dismiss(mp); mp.wait_for_timeout(2000)
                  mp.screenshot(path="ref/list_mobile.png")
                  # PDP with carats
                  for slug in ["women/14k-gold-lab-grown-diamond-tennis-necklace---7ctw",
                               "women/14k-gold-lab-grown-diamond-graduated-tennis-necklace---15ctw",
                               "women/14k-gold-lab-grown-diamond-pave-band"]:
                      try:
                          pg.goto("https://www.quince.com/"+slug,wait_until="domcontentloaded",timeout=60000)
                          pg.wait_for_timeout(4500); dismiss(pg); pg.wait_for_timeout(1500)
                          pg.screenshot(path="ref/pdp.png",full_page=True)
                          print("pdp captured:",slug); break
                      except Exception as e:
                          print("pdp fail",slug,repr(e)[:80])
                  b.close()
              print("shots OK")
          except Exception as e:
              print("shots FAILED", repr(e))
          print("ref files:", sorted(x.name for x in ref.iterdir()))
          PY
          python cap.py
      - name: Publish reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ref-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ref
          git commit -m "Quince jewelry reference capture"
          git push -f origin ref-tmp:claude/quince-ref
