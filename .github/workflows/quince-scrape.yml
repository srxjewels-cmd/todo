name: Verify jsDelivr
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl jsDelivr image URLs
        run: |
          SHA=5448779eae77dec3110dec6c3e646d0bb6ea3df8
          BASE="https://cdn.jsdelivr.net/gh/srxjewels-cmd/todo@${SHA}/docs/photos"
          for path in RE-01/1.jpg RE-01/1_t.jpg N-01/1.jpg B-01/1.jpg EA-01/1.jpg; do
            code=$(curl -sS -o /tmp/img -w '%{http_code}' -L --max-time 60 "$BASE/$path" || echo ERR)
            ctype=$(file -b --mime-type /tmp/img 2>/dev/null || echo '?')
            size=$(stat -c%s /tmp/img 2>/dev/null || echo 0)
            echo "$path -> HTTP $code | $ctype | $size bytes"
          done
