name: Quince scrape

# Runs the scraper on a GitHub-hosted runner (which has normal internet
# access, unlike the restricted Claude Code cloud sandbox), uploads the
# output as an artifact, and force-pushes it to claude/quince-scrape-results
# so the session can pull the files back and hand them to the user.

on:
  workflow_dispatch:
  push:
    branches: [claude/quince-necklace-scraper-w0th5x]
    paths: ['.github/workflows/quince-scrape.yml']

permissions:
  contents: write

concurrency:
  group: quince-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet playwright requests pillow
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python quince_scraper.py --headless --out out/jewels/neckless/1 2>&1 | tee run.log

      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quince-scrape-output
          path: |
            out/
            run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Push results branch
        if: always()
        run: |
          mkdir -p out
          touch -a run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan claude/quince-scrape-results
          git add -f out run.log
          git commit -m "Quince scrape results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push -f origin claude/quince-scrape-results
