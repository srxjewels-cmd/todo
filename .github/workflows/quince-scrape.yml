name: Build variant shop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests pillow
      - name: Scrape Quince variant catalog
        run: python scrape_variants.py
      - name: Build shop page
        run: python build_variant_shop.py shopdata/variants.json --out docs/index.html --brand "SRX DIAMONDS" --whatsapp 919723891732
      - name: Report sizes
        run: |
          echo "photos: $(find docs/photos -type f 2>/dev/null | wc -l) files, $(du -sh docs/photos 2>/dev/null | cut -f1)"
          echo "index.html: $(du -h docs/index.html | cut -f1)"
      - name: Publish to shop-pages (clean tree)
        run: |
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f docs
          git commit -m "Rebuild variant shop (merged colours + carat/size options)"
          git push -f origin pages-tmp:claude/shop-pages
