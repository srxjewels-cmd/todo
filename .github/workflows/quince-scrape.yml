name: Verify live site
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live GitHub Pages site
        run: |
          SITE="https://srxjewels-cmd.github.io/todo/"
          echo "== page =="
          code=$(curl -sS -o /tmp/p.html -w '%{http_code}' -L --max-time 60 "$SITE" || echo ERR)
          echo "HTTP $code, bytes=$(stat -c%s /tmp/p.html 2>/dev/null || echo 0)"
          echo "has SRX DIAMONDS: $(grep -c 'SRX DIAMONDS' /tmp/p.html || echo 0)"
          echo "product refs (photos/): $(grep -oc 'photos/' /tmp/p.html || echo 0)"
          echo "== a product image (same-origin) =="
          for img in photos/RE-01/1.jpg photos/B-01/1.jpg photos/N-01/1_t.jpg; do
            c=$(curl -sS -o /tmp/i -w '%{http_code}' -L --max-time 60 "$SITE$img" || echo ERR)
            echo "$img -> HTTP $c ($(file -b --mime-type /tmp/i 2>/dev/null), $(stat -c%s /tmp/i 2>/dev/null) bytes)"
          done
