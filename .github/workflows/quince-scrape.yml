name: Probe variant values
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Dump real jewelry product variant values
        run: |
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/138 Safari/537.36"}
          url="https://www.quince.com/women/14k-gold-lab-grown-diamond-pendant---1ctw"
          h=requests.get(url,headers=UA,timeout=45).text
          d=json.loads(re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S).group(1))
          prod=d["props"]["pageProps"]["pageData"]["context"]["pageDataJson"]["product"]
          print("TITLE:",prod.get("title"))
          print("SLUG:",prod.get("slug"))
          print("\nPRODUCT_OPTIONS:"); print(json.dumps(prod.get("productOptions"),indent=1)[:1500])
          print("\nnew_color_options:"); print(json.dumps(prod.get("new_color_options"),indent=1)[:1200])
          print("\nVARIANT[0]:")
          v=prod["variants"][0]
          print("  price:",json.dumps(v.get("price"))[:300])
          print("  title:",v.get("title"),"| options:",json.dumps(v.get("options"))[:300])
          print("  traditionalRetailPrice:",json.dumps(v.get("traditionalRetailPrice"))[:200])
          print("\n#variants:",len(prod["variants"]))
          print("variant titles+prices:")
          for v in prod["variants"][:8]:
              pr=v.get("price"); amt=pr.get("amount") if isinstance(pr,dict) else pr
              print("   ",v.get("title"),"|",amt,"| opts:",v.get("options"))
          print("\nIMAGE[0]:",json.dumps(prod["images"][0])[:300])
          print("#images:",len(prod.get("images",[])),"| #dynamicImages:",len(prod.get("dynamicImages",[]) or []))
          # find details/description text
          s=json.dumps(prod)
          for key in ["description","details","longDescription","productDetails","copy","bullets"]:
              i=s.lower().find('"'+key+'"')
              if i>=0: print(f"\nfound key '{key}': ...{s[i:i+200]}")
          PY
