name: Investigate Quince variants
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests
      - name: Probe category + product variant structure
        run: |
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138 Safari/537.36"}
          cat="https://www.quince.com/shop/women/jewelry/necklaces-all/lab-grown-diamond-necklaces"
          h=requests.get(cat,headers=UA,timeout=45).text
          print("category HTML bytes:", len(h))
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          print("has __NEXT_DATA__:", bool(m))
          urls=sorted(set(re.findall(r'/women/[a-z0-9\-]+(?:---[0-9a-z.]+)?', h)))
          prod_urls=[u for u in urls if u.count('/')==2 and 'jewelry' not in u][:6]
          print("sample product paths:", prod_urls[:6])
          # fetch one product page and dump variant-ish keys
          if prod_urls:
              pu="https://www.quince.com"+prod_urls[0]
              ph=requests.get(pu,headers=UA,timeout=45).text
              print("\nPRODUCT:", pu, "| bytes:", len(ph))
              pm=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', ph, re.S)
              if pm:
                  data=json.loads(pm.group(1))
                  s=json.dumps(data)
                  print("NEXT_DATA bytes:", len(s))
                  for kw in ["variant","option","carat","size","colorway","color","length","price","amount","swatch"]:
                      print(f"  '{kw}' occurrences:", s.lower().count(kw))
                  # try to locate a product object with options
                  def walk(o,path=""):
                      out=[]
                      if isinstance(o,dict):
                          keys=set(k.lower() for k in o.keys())
                          if {"options"}&keys or {"variants"}&keys or {"colorways"}&keys:
                              out.append((path, list(o.keys())[:20]))
                          for k,v in o.items(): out+=walk(v,path+"/"+k)
                      elif isinstance(o,list):
                          for i,v in enumerate(o[:3]): out+=walk(v,path+f"[{i}]")
                      return out
                  hits=walk(data)[:8]
                  print("\nnodes with options/variants/colorways:")
                  for p,k in hits: print("  ",p,"=>",k)
          PY
